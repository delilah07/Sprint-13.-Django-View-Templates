{% extends "base.html" %} 
{% block title %}Authors | Library{% endblock %} 
{% block content %}
  <h2>Authors</h2>

  {% if authors %}
  <ul>
    {% for author in authors %}
    <li>{{ author.name }} {{ author.surname }}</li>
    {% endfor %}
  </ul>
  {% else %}
  <p>No authors found.</p>
{% endif %} {% endblock %}
