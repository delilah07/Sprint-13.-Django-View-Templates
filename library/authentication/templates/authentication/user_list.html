{% extends "base.html" %}

{% block content %}
<h1>Users</h1>

{% if users %}
    <ul>
        {% for item in users %}
            <li>
                <a href="{% url 'user_detail' item.id %}">
                    {{ item.first_name }} {{ item.last_name }}
                </a>
                — {{ item.email }}
                ({{ item.get_role_name }})
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>No users found.</p>
{% endif %}

{% endblock %}
